<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar pedido - Sonora</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-pagina="checkout">
<main class="wrap pagina">
<h2 class="t" style="margin-top:0">Finalizar pedido</h2><div class="passos"><div class="feito">1. Carrinho</div><div class="feito">2. Entrega e pagamento</div><div>3. Confirmação</div></div><form id="form" class="duas" novalidate><div><div class="form"><h3>Dados do cliente</h3><div class="campos"><div class="campo"><input type="text" id="nome" name="nome" placeholder="Nome completo" autocomplete="off"><span class="erro" data-erro="nome"></span></div><div class="campo"><input type="email" id="email" name="email" placeholder="E-mail" autocomplete="off"><span class="erro" data-erro="email"></span></div><div class="campo"><input type="text" id="cpf" name="cpf" placeholder="CPF" autocomplete="off"><span class="erro" data-erro="cpf"></span></div><div class="campo"><input type="text" id="telefone" name="telefone" placeholder="Telefone" autocomplete="off"><span class="erro" data-erro="telefone"></span></div><div class="campo"><input type="text" id="cep" name="cep" placeholder="CEP" autocomplete="off"><span class="erro" data-erro="cep"></span></div><div class="campo"><input type="text" id="endereco" name="endereco" placeholder="Rua" autocomplete="off"><span class="erro" data-erro="endereco"></span></div><div class="campo"><input type="text" id="numero" name="numero" placeholder="Número" autocomplete="off"><span class="erro" data-erro="numero"></span></div><div class="campo"><input type="text" id="bairro" name="bairro" placeholder="Bairro" autocomplete="off"><span class="erro" data-erro="bairro"></span></div><div class="campo"><input type="text" id="cidade" name="cidade" placeholder="Cidade" autocomplete="off"><span class="erro" data-erro="cidade"></span></div><div class="campo"><input type="text" id="estado" name="estado" placeholder="Estado (sigla)" autocomplete="off"><span class="erro" data-erro="estado"></span></div></div></div><div class="form"><h3>Forma de pagamento</h3><div class="opcoes"><label><input type="radio" name="pgto" value="credito" checked><span>Cartão de crédito</span></label><label><input type="radio" name="pgto" value="debito"><span>Cartão de débito</span></label><label><input type="radio" name="pgto" value="pix"><span>PIX</span></label></div><div id="p-cartao"><div class="campos"><div class="campo"><input type="text" id="cartao" name="cartao" placeholder="Número do cartão" autocomplete="off"><span class="erro" data-erro="cartao"></span></div><div class="campo"><input type="text" id="cartaonome" name="cartaonome" placeholder="Nome impresso" autocomplete="off"><span class="erro" data-erro="cartaonome"></span></div><div class="campo"><input type="text" id="validade" name="validade" placeholder="Validade (MM/AA)" autocomplete="off"><span class="erro" data-erro="validade"></span></div><div class="campo"><input type="text" id="cvv" name="cvv" placeholder="CVV" autocomplete="off"><span class="erro" data-erro="cvv"></span></div></div><div class="campo" id="p-parc" style="margin-top:14px"><select id="parcelas"></select></div></div><div id="p-pix" hidden><div class="pix"><div class="qr" id="qr"></div><p>Escaneie o QR Code ou copie o código (simulação)</p><input id="pixcod" readonly><button type="button" class="btn btn-sec" id="copiar">Copiar código PIX</button></div></div></div></div><div class="resumo"><h3>Seu pedido</h3><div id="itens"></div><p><span>Subtotal</span><span id="sub"></span></p><p><span>Frete</span><span>Grátis</span></p><p><span>Desconto</span><span id="desc"></span></p><p class="total"><span>Total</span><span id="total"></span></p><button class="btn" type="submit">Confirmar pedido</button><small>Simulação: não use dados reais. Você tem 30 dias para devolver.</small></div></form>
</main>
<script src="script.html"></script>
</body>
</html>
